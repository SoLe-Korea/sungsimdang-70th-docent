<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3층 전시실 도슨트</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-floor="3">
  <main class="docent">
    <nav class="lang-chips" id="lang-chips" aria-label="Language selection"></nav>

    <div class="audio-controls" id="audio-controls">
      <button type="button" class="btn btn-audio" id="btn-playpause">▶ 음성으로 듣기</button>
      <button type="button" class="btn btn-audio" id="btn-stop" disabled>⏹ 정지</button>
    </div>

    <h1 class="title" id="title"></h1>
    <div class="content" id="content"></div>

    <p class="notice" id="voice-notice" hidden></p>
  </main>

  <script src="../js/docent.js"></script>
</body>
</html>
